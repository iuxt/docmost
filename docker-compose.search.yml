# Optional Typesense support:
# docker compose -f docker-compose.yml -f docker-compose.search.yml up -d
services:
  docmost:
    depends_on:
      typesense:
        condition: service_healthy

  typesense:
    image: typesense/typesense:30.1
    # Enter this same key in Settings → Workspace → General after startup.
    command: ["--data-dir=/data", "--api-key=817f217a-4b57-4535-bfd3-45947517f02d"]
    restart: unless-stopped
    volumes:
      - typesense_data:/data
    healthcheck:
      # The upstream image has Bash but does not include curl or wget.
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8108;
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  typesense_data:
